<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Bulwriter</title>
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="/bulwriter-logo.png">

    <!-- Applies the saved theme before Angular loads, so there's no
         flash of the light theme on a dark-theme reload. Light is the
         default for anyone who hasn't chosen yet. -->
    <script>
      (function () {
        var theme = localStorage.getItem('bulwriter:theme');
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      })();
    </script>
