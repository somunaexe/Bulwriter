<div class="breakdown-drawer">
  <header class="breakdown-header">
    <span>Casting</span>
    <div class="breakdown-header-actions">
      <button class="btn-ghost" (click)="exportCsv()" [disabled]="!groups.length">Export CSV</button>
      <button class="btn-icon" (click)="close.emit()">✕</button>
    </div>
  </header>

  <div *ngIf="loading" class="loading">Loading casting…</div>

  <div class="casting-body" *ngIf="!loading">
    <p class="empty-msg" *ngIf="!groups.length">No characters with dialogue yet.</p>

    <div class="casting-role" *ngFor="let group of groups">
      <div class="casting-role-header">
        <span class="casting-role-name">{{ group.characterName }}</span>
        <span class="casting-role-scenes">{{ group.sceneCount }} scene{{ group.sceneCount === 1 ? '' : 's' }}</span>
      </div>

      <div class="casting-candidates">
        <div class="casting-candidate" *ngFor="let c of group.candidates" [class.cast]="c.isCast">
          <div class="casting-candidate-fields">
            <div class="casting-candidate-row">
              <input class="input-sm" placeholder="Actor name…" [(ngModel)]="c.actorName" (blur)="save(c)" [disabled]="!canEdit" />
              <select class="casting-status input-sm" [class]="'casting-status-' + c.status"
                      [(ngModel)]="c.status" (change)="save(c)" [disabled]="!canEdit">
                <option *ngFor="let s of statuses" [value]="s">{{ s }}</option>
              </select>
              <span class="casting-cast-badge" *ngIf="c.isCast">Cast</span>
              <button *ngIf="canEdit && !c.isCast" class="btn-ghost casting-cast-btn" (click)="cast(group, c)">Cast</button>
              <button *ngIf="canEdit" class="casting-remove-btn" (click)="remove(group, c)" aria-label="Remove candidate">×</button>
            </div>
            <input class="input-sm" placeholder="Contact (email or phone)…" [(ngModel)]="c.contact" (blur)="save(c)" [disabled]="!canEdit" />
            <textarea class="casting-notes" placeholder="Audition notes, availability…" [(ngModel)]="c.notes" (blur)="save(c)" [readonly]="!canEdit"></textarea>
          </div>
        </div>
      </div>

      <div class="casting-add" *ngIf="canEdit">
        <input class="input-sm" placeholder="Actor name…" [(ngModel)]="group.newActorName" (keydown.enter)="addCandidate(group)" />
        <input class="input-sm" placeholder="Contact…" [(ngModel)]="group.newContact" (keydown.enter)="addCandidate(group)" />
        <button class="btn-ghost" (click)="addCandidate(group)" [disabled]="!group.newActorName.trim()">+ Add candidate</button>
      </div>
    </div>
  </div>
</div>
