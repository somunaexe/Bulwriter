<div class="collab-stack" *ngIf="collaborators.length || canManage">
  <button
    *ngFor="let c of collaborators"
    type="button"
    class="collab-avatar"
    [class.pending]="!c.accepted"
    [class.open]="openKey === c.key"
    (click)="toggle(c.key)"
    [attr.aria-label]="c.name"
  >
    <img *ngIf="c.imageUrl" [src]="c.imageUrl" [alt]="c.name" />
    <span *ngIf="!c.imageUrl">{{ initials(c.name) }}</span>
  </button>

  <!-- Only an owner can invite/remove collaborators, or an owner/editor
       add/remove crew — everyone else just sees who's here. For
       collaborators, reuses the existing "Manage collaborators" page
       rather than duplicating that UI in a popover here; crew always
       uses the inline popover since there's no separate manage page. -->
  <button
    *ngIf="canManage"
    type="button"
    class="collab-avatar collab-manage"
    [attr.aria-label]="mode === 'crew' ? 'Add or remove crew' : 'View, add, and remove collaborators'"
    [title]="mode === 'crew' ? 'Add or remove crew' : 'View, add, and remove collaborators'"
    (click)="onManageClick()"
  >+</button>

  <div class="collab-invite-popover" *ngIf="showInvitePopover && mode === 'collaborators'">
    <p class="invite-popover-title">Invite collaborator</p>
    <input
      class="input-sm"
      placeholder="Invite by email…"
      [(ngModel)]="inviteEmail"
      (keydown.enter)="sendInvite()"
      autofocus />
    <p class="invite-popover-error" *ngIf="inviteError">{{ inviteError }}</p>
    <div class="invite-popover-actions">
      <button class="btn-ghost" (click)="showInvitePopover = false">Cancel</button>
      <button class="btn-save" (click)="sendInvite()" [disabled]="!inviteEmail.trim() || inviteSending">
        {{ inviteSending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </div>

  <div class="collab-invite-popover" *ngIf="showInvitePopover && mode === 'crew'">
    <p class="invite-popover-title">Add crew member</p>
    <input class="input-sm" placeholder="Role (e.g. DP)…" [(ngModel)]="newCrewRole" (keydown.enter)="addCrewMember()" autofocus />
    <input class="input-sm" placeholder="Name…" [(ngModel)]="newCrewName" (keydown.enter)="addCrewMember()" />
    <input class="input-sm" placeholder="Contact…" [(ngModel)]="newCrewContact" (keydown.enter)="addCrewMember()" />
    <p class="invite-popover-error" *ngIf="inviteError">{{ inviteError }}</p>
    <div class="invite-popover-actions">
      <button class="btn-ghost" (click)="showInvitePopover = false">Cancel</button>
      <button class="btn-save" (click)="addCrewMember()" [disabled]="!newCrewName.trim() || inviteSending">
        {{ inviteSending ? 'Adding…' : 'Add' }}
      </button>
    </div>
  </div>

  <div class="collab-popover" *ngIf="openKey">
    <ng-container *ngFor="let c of collaborators">
      <div class="collab-detail" *ngIf="c.key === openKey">
        <img *ngIf="c.imageUrl" class="detail-avatar" [src]="c.imageUrl" [alt]="c.name" />
        <span *ngIf="!c.imageUrl" class="detail-avatar detail-avatar-fallback">{{ initials(c.name) }}</span>
        <div class="detail-info">
          <span class="detail-name">{{ c.name }}</span>
          <span class="detail-email" *ngIf="c.contact">{{ c.contact }}</span>
          <span class="detail-role">{{ c.role }}</span>
          <span class="detail-email" *ngIf="c.notes">{{ c.notes }}</span>
          <span class="detail-status" *ngIf="mode === 'collaborators'" [class.accepted]="c.accepted">
            {{ c.accepted ? 'Accepted' : 'Invite pending' }}
          </span>
          <button *ngIf="mode === 'crew' && canManage" class="btn-icon detail-remove" (click)="removeCrewMember(c.key)">Remove</button>
        </div>
      </div>
    </ng-container>
  </div>
</div>
