<div class="collab-stack" *ngIf="collaborators.length || canManage">
  <button
    *ngFor="let c of collaborators"
    type="button"
    class="collab-avatar"
    [class.pending]="!c.accepted"
    [class.open]="openKey === c.key"
    (click)="toggle(c.key)"
    [attr.aria-label]="c.name"
  >
    <img *ngIf="c.imageUrl" [src]="c.imageUrl" [alt]="c.name" />
    <span *ngIf="!c.imageUrl">{{ initials(c.name) }}</span>
  </button>

  <!-- Only owners can invite/remove people — everyone else just sees
       who's here. Reuses the existing "Manage collaborators" page
       rather than duplicating that UI in a popover here. -->
  <button
    *ngIf="canManage"
    type="button"
    class="collab-avatar collab-manage"
    aria-label="View, add, and remove collaborators"
    title="View, add, and remove collaborators"
    (click)="onManageClick()"
  >+</button>

  <div class="collab-invite-popover" *ngIf="showInvitePopover">
    <p class="invite-popover-title">Invite collaborator</p>
    <input
      class="input-sm"
      placeholder="Invite by email…"
      [(ngModel)]="inviteEmail"
      (keydown.enter)="sendInvite()"
      autofocus />
    <p class="invite-popover-error" *ngIf="inviteError">{{ inviteError }}</p>
    <div class="invite-popover-actions">
      <button class="btn-ghost" (click)="showInvitePopover = false">Cancel</button>
      <button class="btn-save" (click)="sendInvite()" [disabled]="!inviteEmail.trim() || inviteSending">
        {{ inviteSending ? 'Sending…' : 'Send' }}
      </button>
    </div>
  </div>

  <div class="collab-popover" *ngIf="openKey">
    <ng-container *ngFor="let c of collaborators">
      <div class="collab-detail" *ngIf="c.key === openKey">
        <img *ngIf="c.imageUrl" class="detail-avatar" [src]="c.imageUrl" [alt]="c.name" />
        <span *ngIf="!c.imageUrl" class="detail-avatar detail-avatar-fallback">{{ initials(c.name) }}</span>
        <div class="detail-info">
          <span class="detail-name">{{ c.name }}</span>
          <span class="detail-email" *ngIf="c.email">{{ c.email }}</span>
          <span class="detail-role">{{ c.role }}</span>
          <span class="detail-status" [class.accepted]="c.accepted">
            {{ c.accepted ? 'Accepted' : 'Invite pending' }}
          </span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
