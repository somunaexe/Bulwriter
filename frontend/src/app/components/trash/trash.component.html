<div class="dashboard">

  <header class="dash-header">
    <h1 class="logo">Trash</h1>
    <p class="tagline">Items are kept for 30 days, then permanently discarded.</p>
  </header>

  <section class="story-bible-link">
    <button class="btn-ghost" (click)="back()">← Back</button>
  </section>

  <section class="project-list">

    <p class="loading-msg" *ngIf="loading">Loading…</p>
    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <ng-container *ngIf="!isProjectTrash">
      <p class="empty-msg" *ngIf="!loading && !error && projects.length === 0">
        No deleted projects.
      </p>

      <div class="project-card trash-card" *ngFor="let p of projects">
        <div class="project-card-main">
          <div class="project-card-title">{{ p.title }}</div>
          <div class="project-card-meta">{{ daysLeft(p.deletedAt) }} days left</div>
        </div>
        <button class="btn-ghost" (click)="restoreProject(p)" [disabled]="restoring[p.id]">
          Restore
        </button>
      </div>
    </ng-container>

    <ng-container *ngIf="isProjectTrash">
      <p class="empty-msg" *ngIf="!loading && !error && scripts.length === 0">
        No deleted scripts.
      </p>

      <div class="project-card trash-card" *ngFor="let s of scripts">
        <div class="project-card-main">
          <div class="project-card-title">{{ s.title }}</div>
          <div class="project-card-meta">{{ daysLeft(s.deletedAt) }} days left</div>
        </div>
        <button class="btn-ghost" (click)="restoreScript(s)" [disabled]="restoring[s.id]">
          Restore
        </button>
      </div>
    </ng-container>

  </section>
</div>
