<div class="stripboard-backdrop" (click)="close.emit()">
  <div class="stripboard-panel" (click)="$event.stopPropagation()">
    <header class="breakdown-header">
      <span>Shooting schedule</span>
      <div class="breakdown-header-actions">
        <button class="btn-ghost" (click)="exportCsv()" [disabled]="!days.length">Export CSV</button>
        <button class="btn-icon" (click)="close.emit()">✕</button>
      </div>
    </header>

    <div *ngIf="loading" class="loading">Loading schedule…</div>

    <div class="stripboard-body" *ngIf="!loading" cdkDropListGroup>
      <div class="stripboard-day" *ngFor="let day of days">
        <div class="stripboard-day-header">
          <span>Day {{ day.dayNumber }}</span>
          <span class="stripboard-day-header-actions">
            <button
              class="btn-icon"
              (click)="openCallSheet(day)"
              title="Call sheet"
              aria-label="Call sheet">📋</button>
            <button
              *ngIf="canEdit && !day.strips.length"
              class="btn-icon"
              (click)="removeDay(day)"
              aria-label="Remove day">✕</button>
          </span>
        </div>

        <div class="stripboard-strip-list"
             cdkDropList
             [cdkDropListData]="day.strips"
             [cdkDropListDisabled]="!canEdit"
             (cdkDropListDropped)="onDrop($event)">

          <div class="stripboard-strip" *ngFor="let strip of day.strips" cdkDrag [cdkDragDisabled]="!canEdit">
            <div class="stripboard-strip-heading-row">
              <span class="stripboard-strip-number">{{ strip.number }}</span>
              <span class="stripboard-strip-heading">{{ strip.heading }}</span>
            </div>
            <div class="breakdown-chips" *ngIf="strip.cast.length">
              <span class="breakdown-chip breakdown-chip-cast" *ngFor="let c of strip.cast">{{ c }}</span>
            </div>
          </div>

          <p class="stripboard-empty" *ngIf="!day.strips.length">Drag scenes here</p>
        </div>
      </div>

      <button *ngIf="canEdit" class="stripboard-add-day" (click)="addDay()">+ Add day</button>
    </div>
  </div>
</div>

<app-modal
  *ngIf="callSheetDay"
  [title]="'Call sheet — Day ' + callSheetDay.dayNumber"
  (closed)="closeCallSheet()">
  <div class="call-sheet-form">
    <label class="call-sheet-field">
      <span class="breakdown-field-label">Shoot date</span>
      <input class="input-sm" type="date" [(ngModel)]="callSheetDay.shootDate" [disabled]="!canEdit" />
    </label>
    <label class="call-sheet-field">
      <span class="breakdown-field-label">General call time</span>
      <input class="input-sm" type="time" [(ngModel)]="callSheetDay.callTime" [disabled]="!canEdit" />
    </label>
    <label class="call-sheet-field">
      <span class="breakdown-field-label">Location</span>
      <input class="input-sm" placeholder="Address or description…" [(ngModel)]="callSheetDay.location" [disabled]="!canEdit" />
    </label>
    <label class="call-sheet-field">
      <span class="breakdown-field-label">Notes</span>
      <textarea class="breakdown-notes" placeholder="Parking, weather, safety notes…" [(ngModel)]="callSheetDay.notes" [readonly]="!canEdit"></textarea>
    </label>

    <p class="call-sheet-scene-count">{{ callSheetDay.strips.length }} scene{{ callSheetDay.strips.length === 1 ? '' : 's' }} scheduled this day.</p>

    <hr class="panel-divider" />

    <h3 class="section-label">Daily wrap log</h3>

    <label class="call-sheet-checkbox">
      <input type="checkbox" [(ngModel)]="callSheetDay.dataBackedUp" [disabled]="!canEdit" />
      <span>Footage &amp; sound data backed up</span>
    </label>
    <label class="call-sheet-checkbox">
      <input type="checkbox" [(ngModel)]="callSheetDay.dailiesReviewed" [disabled]="!canEdit" />
      <span>Dailies reviewed</span>
    </label>

    <label class="call-sheet-field">
      <span class="breakdown-field-label">Camera report</span>
      <textarea class="breakdown-notes" placeholder="Mags shot, gate checks, issues…" [(ngModel)]="callSheetDay.cameraReport" [readonly]="!canEdit"></textarea>
    </label>
    <label class="call-sheet-field">
      <span class="breakdown-field-label">Sound report</span>
      <textarea class="breakdown-notes" placeholder="Rolls recorded, ADR flags, issues…" [(ngModel)]="callSheetDay.soundReport" [readonly]="!canEdit"></textarea>
    </label>
    <label class="call-sheet-field">
      <span class="breakdown-field-label">Wrap notes</span>
      <textarea class="breakdown-notes" placeholder="Wrap meeting notes, tomorrow's prep…" [(ngModel)]="callSheetDay.wrapNotes" [readonly]="!canEdit"></textarea>
    </label>

    <div class="find-replace-actions">
      <button class="btn-ghost" (click)="closeCallSheet()">Close</button>
      <button class="btn-save" (click)="exportCallSheet()">Export PDF</button>
    </div>
  </div>
</app-modal>
