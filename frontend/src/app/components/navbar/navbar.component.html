<nav class="navbar">

  <!-- Left: Brand -->
  <button class="brand" (click)="openProjects()">Bulwriter</button>

  <!-- Middle: main nav -->
  <div class="nav-links" [class.open]="menuOpen">
    <a routerLink="/" (click)="openProjects()">Projects</a>
    <a routerLink="/donate" (click)="menuOpen = false">Support</a>
  </div>

  <!-- Right: account -->
  <div class="auth">
    <button
      *ngIf="theme.theme$ | async as current"
      type="button"
      class="theme-toggle"
      role="switch"
      [class.dark]="current === 'dark'"
      [attr.aria-checked]="current === 'dark'"
      [attr.aria-label]="current === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [title]="current === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      (click)="theme.toggle()">
      <span class="theme-toggle-thumb">
        <svg *ngIf="current === 'light'" class="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"></circle>
          <line x1="12" y1="1.5" x2="12" y2="3.5"></line>
          <line x1="12" y1="20.5" x2="12" y2="22.5"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1.5" y1="12" x2="3.5" y2="12"></line>
          <line x1="20.5" y1="12" x2="22.5" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg *ngIf="current === 'dark'" class="theme-icon" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </span>
    </button>

    <ng-container *ngIf="signedIn$ | async; else signedOut">
      <div class="account" *ngIf="user$ | async as user">
        <button class="account-btn" (click)="toggleAccount()" [class.open]="accountOpen">
          <span class="avatar" *ngIf="!user.imageUrl">{{ initials(user.name) }}</span>
          <img class="avatar" *ngIf="user.imageUrl" [src]="user.imageUrl" [alt]="user.name" />
          <span class="account-name">{{ user.name }}</span>
          <span class="chevron">▾</span>
        </button>

        <div class="dropdown-menu" *ngIf="accountOpen">
          <div class="dropdown-header">
            <span class="dropdown-name">{{ user.name }}</span>
            <span class="dropdown-email" *ngIf="user.email">{{ user.email }}</span>
          </div>
          <div class="menu-divider"></div>
          <button (click)="openAccount()">Account settings</button>
          <button (click)="toggleAbout()">About Bulwriter</button>
          <div class="menu-divider"></div>
          <button class="signout" (click)="signOut()">Sign out</button>
        </div>
      </div>
    </ng-container>

    <ng-template #signedOut>
      <button class="signout" routerLink="/sign-in">Sign in</button>
    </ng-template>

    <button class="hamburger" (click)="toggleMenu()" aria-label="Toggle menu">
      ☰
    </button>
  </div>
</nav>

<!-- About panel -->
<div class="about-overlay" *ngIf="aboutOpen" (click)="toggleAbout()">
  <div class="about-panel" (click)="$event.stopPropagation()">
    <h2>Bulwriter</h2>
    <p>Collaborative screenwriting with Git-style version control and real-time co-writing.</p>
    <p class="about-meta">Industry-standard Fountain import/export, branch-based drafts, and live collaboration.</p>
    <p class="about-meta">Free and open-source, always — <a routerLink="/donate" (click)="toggleAbout()">support the project</a>.</p>
    <button class="btn-ghost" (click)="toggleAbout()">Close</button>
  </div>
</div>
