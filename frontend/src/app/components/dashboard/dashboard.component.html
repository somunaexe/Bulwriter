<div class="dashboard">

  <header class="dash-header">
    <h1 class="logo">Bulwriter</h1>
    <p class="tagline">Your screenwriting workspace</p>
  </header>

  <section class="invites" *ngIf="!invitesLoading && invites.length > 0">
    <h2 class="section-label">Your invites</h2>
    <ul class="invite-inbox-list">
      <li *ngFor="let inv of invites" class="invite-inbox-item">
        <span class="invite-inbox-info">
          <span class="invite-inbox-project">{{ inv.projectTitle || 'Untitled project' }}</span>
          <span class="invite-inbox-role">as {{ inv.role }}</span>
        </span>
        <span class="invite-inbox-actions">
          <button class="btn-ghost" (click)="declineInvite(inv)" [disabled]="invitePending[inv.id]">Decline</button>
          <button class="btn-save" (click)="acceptInvite(inv)" [disabled]="invitePending[inv.id]">Accept</button>
        </span>
      </li>
    </ul>
  </section>

  <section class="new-project">
    <input
      [(ngModel)]="newTitle"
      placeholder="New project title…"
      class="input-lg"
      (keydown.enter)="createProject()" />
    <button class="btn-save" (click)="createProject()" [disabled]="!newTitle.trim()">
      Create project
    </button>
  </section>

  <section class="project-list">

    <p class="loading-msg" *ngIf="loading">Loading…</p>
    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <p class="empty-msg" *ngIf="!loading && !error && projects.length === 0">
      No projects yet. Create one above.
    </p>

    <div class="project-card"
         *ngFor="let p of projects"
         (click)="openProject(p.id)">
      <div class="project-card-title">{{ p.title }}</div>
      <div class="project-card-meta">{{ p.createdAt | date:'mediumDate' }}</div>
    </div>

  </section>
</div>
