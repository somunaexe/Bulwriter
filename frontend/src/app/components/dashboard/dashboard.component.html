<div class="dashboard">

  <header class="dash-header">
    <h1 class="logo">Bulwriter</h1>
    <p class="tagline">Your screenwriting workspace</p>
  </header>

  <section class="story-bible-link">
    <button class="btn-ghost" (click)="openTrash()">Trash</button>
  </section>

  <section class="invites" *ngIf="!invitesLoading && invites.length > 0">
    <h2 class="section-label">Your invites</h2>
    <ul class="invite-inbox-list">
      <li *ngFor="let inv of invites" class="invite-inbox-item">
        <span class="invite-inbox-info">
          <span class="invite-inbox-project">{{ inv.projectTitle || 'Untitled project' }}</span>
          <span class="invite-inbox-role">as {{ inv.role }}</span>
        </span>
        <span class="invite-inbox-actions">
          <button class="btn-ghost" (click)="declineInvite(inv)" [disabled]="invitePending[inv.id]">Decline</button>
          <button class="btn-save" (click)="acceptInvite(inv)" [disabled]="invitePending[inv.id]">Accept</button>
        </span>
      </li>
    </ul>
  </section>

  <section class="new-project">
    <input
      [(ngModel)]="newTitle"
      placeholder="New project title…"
      class="input-lg"
      (keydown.enter)="createProject()" />
    <button class="btn-save" (click)="createProject()" [disabled]="!newTitle.trim()">
      Create project
    </button>
  </section>

  <section class="project-list">

    <p class="loading-msg" *ngIf="loading">Loading…</p>
    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <p class="empty-msg" *ngIf="!loading && !error && projects.length === 0">
      No projects yet. Create one above.
    </p>

    <div class="project-card"
         *ngFor="let p of projects"
         (click)="openProject(p.id)">
      <div class="project-card-main">
        <div class="project-card-title">{{ p.title }}</div>
        <div class="project-card-meta">{{ p.createdAt | date:'mediumDate' }}</div>
      </div>
      <button
        class="btn-icon card-action-btn"
        *ngIf="isOwnerOf(p)"
        title="Rename"
        (click)="openRenameProject($event, p)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 20h9"></path>
          <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
        </svg>
      </button>
      <button
        class="btn-icon card-delete-btn"
        *ngIf="isOwnerOf(p)"
        title="Move to trash"
        (click)="deleteProject($event, p)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
    </div>

  </section>

  <app-modal *ngIf="renamingProject" title="Rename project" (closed)="renamingProject = null">
    <div class="find-replace-form">
      <input
        class="input-sm"
        [(ngModel)]="renameTitle"
        (keydown.enter)="confirmRename()"
        autofocus />
      <p class="error-msg" *ngIf="renameError">{{ renameError }}</p>
      <div class="find-replace-actions">
        <button class="btn-ghost" (click)="renamingProject = null">Cancel</button>
        <button class="btn-save" (click)="confirmRename()" [disabled]="!renameTitle.trim()">Save</button>
      </div>
    </div>
  </app-modal>
</div>
