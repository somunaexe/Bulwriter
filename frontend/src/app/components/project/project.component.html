<div class="dashboard">

  <header class="dash-header">
    <h1 class="logo">{{ project?.title }}</h1>
  </header>

  <section class="story-bible-link">
    <button class="btn-ghost" (click)="openStory()">Story bible</button>
  </section>

  <!-- Only editors and owners can create scripts -->
  <section class="new-project" *ngIf="canEdit">
    <input
      [(ngModel)]="newTitle"
      placeholder="New script title…"
      class="input-lg"
      (keydown.enter)="createScript()" />
    <button class="btn-save" (click)="createScript()" [disabled]="!newTitle.trim()">
      Create script
    </button>
  </section>

  <section class="project-list">

    <p class="loading-msg" *ngIf="loading">Loading…</p>
    <p class="error-msg" *ngIf="error">{{ error }}</p>

    <p class="empty-msg" *ngIf="!loading && !error && scripts.length === 0">
      No scripts yet. Create one above.
    </p>

    <div class="project-card"
         *ngFor="let s of scripts"
         (click)="openScript(s.id)">
      <div class="project-card-title">{{ s.title }}</div>
      <div class="project-card-meta">{{ s.createdAt | date:'mediumDate' }}</div>
    </div>

  </section>

  <section class="collaborators">
    <h2 class="section-label">Collaborators</h2>

    <app-collaborator-stack
      #collabStack
      [projectId]="projectId"
      [canManage]="isOwner"
      (manage)="openInviteModal()"
    ></app-collaborator-stack>
  </section>

  <section class="collaborators">
    <h2 class="section-label">Crew</h2>

    <app-crew-list
      [projectId]="projectId"
      [canEdit]="canEdit"
    ></app-crew-list>
  </section>

  <app-modal *ngIf="showInviteModal" title="Invite collaborator" (closed)="showInviteModal = false">
    <div class="find-replace-form">
      <input
        [(ngModel)]="inviteEmail"
        placeholder="Invite by email…"
        class="input-sm"
        (keydown.enter)="sendInvite()"
        autofocus />
      <p class="error-msg" *ngIf="inviteError">{{ inviteError }}</p>
      <div class="find-replace-actions">
        <button class="btn-ghost" (click)="showInviteModal = false">Cancel</button>
        <button class="btn-save" (click)="sendInvite()" [disabled]="!inviteEmail.trim()">
          Send invite
        </button>
      </div>
    </div>
  </app-modal>
</div>
