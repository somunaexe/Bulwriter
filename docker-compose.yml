services:
  db:
    image: postgres:16
    container_name: bulwriter-db
    environment:
      POSTGRES_USER: ${DB_USER:-bulwriter}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-bulwriter_dev}
      POSTGRES_DB: ${DB_NAME:-bulwriter}
    ports:
      - "5432:5432"
    volumes:
      # This persists your database data even if the container is removed.
      # Without this, all data is lost when the container stops.
      - bulwriter_db_data:/var/lib/postgresql/data
    healthcheck:
      # The backend won't start until Postgres is actually ready to
      # accept connections — not just started, but fully initialised.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-bulwriter} -d ${DB_NAME:-bulwriter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      # Dev image: runs `air`, which watches .go files and rebuilds/
      # restarts on save — no more `docker compose up --build` per change.
      # Railway deploys still use backend/Dockerfile (see railway.json).
      dockerfile: backend/Dockerfile.dev
    container_name: bulwriter-backend
    ports:
      - "8080:8080"
    environment:
      # DB_USER/DB_PASSWORD/DB_NAME default to plain local-only values
      # above since this Postgres only ever runs inside the docker-compose
      # network — but CLERK_SECRET_KEY and ANTHROPIC_API_KEY are real
      # credentials with no safe default, so they're required in your own
      # untracked .env file (see .env.example) rather than committed here.
      DATABASE_URL: postgres://${DB_USER:-bulwriter}:${DB_PASSWORD:-bulwriter_dev}@db:5432/${DB_NAME:-bulwriter}?sslmode=disable
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in a .env file — see .env.example}
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API:-https://wanted-gelding-91.clerk.accounts.dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - .:/app
      - go_mod_cache:/root/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy  # waits for the healthcheck above to pass

volumes:
  bulwriter_db_data:
  go_mod_cache: