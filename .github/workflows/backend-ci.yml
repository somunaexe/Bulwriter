name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    # Some store-level tests (internal/donation) run against a real
    # Postgres rather than mocking the database — this service container
    # is what DATABASE_URL below points them at. Tests that need it skip
    # cleanly if it's ever unavailable, but CI always provides it.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bulwriter_ci
          POSTGRES_PASSWORD: bulwriter_ci
          POSTGRES_DB: bulwriter_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -o bulwriter ./backend/cmd/server

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          DATABASE_URL: postgres://bulwriter_ci:bulwriter_ci@localhost:5432/bulwriter_ci?sslmode=disable
        run: go test ./... -race
