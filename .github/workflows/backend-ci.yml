name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - claude/cors-projects-list-qs9vze

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build
        run: CGO_ENABLED=0 GOOS=linux go build -o bulwriter ./backend/cmd/server

      - name: Vet
        run: go vet ./...
